<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4F0">
<title>Заковат</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4F0; --card:#FFFFFF; --ink:#15171C; --muted:#80848F; --line:#E8E6E0; --soft:#F0EFEA;
  --accent:#6C4DFF; --warn:#FF9F0A; --danger:#FF3B30;
  --r:28px;
  --fd:'Unbounded','Manrope',system-ui,sans-serif;
  --f:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --pad:clamp(14px,2.6vw,40px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
svg{display:block}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px var(--pad);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:46px;height:46px;border-radius:50%;flex:none;position:relative;
  background:conic-gradient(#2F6BFF 0 25%,#12B76A 0 50%,#F5A400 0 75%,#FF5A36 0)}
.logo::after{content:'';position:absolute;inset:9px;border-radius:50%;background:var(--bg)}
.logo::before{content:'';position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--ink);z-index:1}
.brand h1{font-family:var(--fd);font-weight:800;font-size:clamp(18px,1.9vw,26px);letter-spacing:.06em;line-height:1}
.brand small{display:block;margin-top:5px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.qnav{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:99px;padding:6px;box-shadow:0 1px 0 var(--line)}
.qnav button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:.15s}
.qnav button:hover{background:var(--soft);color:var(--ink)}
.qlabel{padding:0 10px;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.qlabel span{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.qlabel b{font-family:var(--fd);font-size:22px;font-weight:700}
.qlabel i{font-style:normal;font-family:var(--fd);font-size:14px;color:var(--muted)}

.actions{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--card);border-radius:99px;padding:4px;box-shadow:0 1px 0 var(--line)}
.seg button{height:36px;padding:0 12px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.ibtn{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 0 var(--line);transition:.15s}
.ibtn:hover{transform:translateY(-1px);box-shadow:0 1px 0 var(--line),0 10px 24px -14px rgba(0,0,0,.3)}

/* ---------- stage ---------- */
main{flex:1;padding:6px var(--pad) 18px;display:flex;flex-direction:column;gap:clamp(18px,2.4vw,32px)}
.timer-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}

.ring{--size:clamp(220px,min(40vh,72vw),460px);--tc:var(--accent);width:var(--size);height:var(--size);position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.track{stroke:#E9E7F1}
.prog{stroke:var(--tc);stroke-linecap:round;transition:stroke .35s}
.tick{stroke:#DAD7E3;stroke-width:1.2;stroke-linecap:round}
.tick.big{stroke:#B7B2C9;stroke-width:2}
.ring-center{position:absolute;inset:13%;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 30px 70px -30px rgba(60,40,140,.28),0 1px 0 var(--line)}
.time{font-family:var(--fd);font-weight:700;font-size:calc(var(--size)*.215);line-height:1;color:var(--ink);transition:color .35s;display:flex}
.time .d{display:inline-block;width:.74em;text-align:center}
.time .c{display:inline-block;width:.34em;text-align:center;transform:translateY(-.04em)}
.status{margin-top:calc(var(--size)*.035);font-size:clamp(11px,calc(var(--size)*.036),16px);font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.ring.warn{--tc:var(--warn)} .ring.warn .time{color:#D97F00}
.ring.danger{--tc:var(--danger)} .ring.danger .time{color:var(--danger)}
.ring.done{--tc:var(--danger)} .ring.done .time{color:var(--danger)}
.ring.done .ring-center{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 0 18px rgba(255,59,48,.12)}}

.banner{min-height:42px;display:flex;align-items:center}
.banner span{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:99px;font-weight:800;font-size:14px;letter-spacing:.02em;
  background:color-mix(in srgb,var(--c) 12%,#fff);color:color-mix(in srgb,var(--c) 80%,#000);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent);animation:pop .35s}
.banner span::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--c)}

.controls{display:flex;align-items:center;gap:12px}
.cbtn{width:60px;height:60px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 0 var(--line);font-weight:800;font-size:14px;transition:.15s}
.cbtn:hover{transform:translateY(-1px)}
.main-btn{height:68px;min-width:210px;padding:0 30px;border-radius:99px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;
  font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:.02em;box-shadow:0 18px 40px -18px var(--accent);transition:.15s}
.main-btn:hover{transform:translateY(-2px)}
.main-btn:active{transform:translateY(0) scale(.98)}
.main-btn.running{background:var(--ink);box-shadow:0 18px 40px -20px rgba(0,0,0,.6)}

.presets{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:99px;box-shadow:0 1px 0 var(--line)}
.presets button{height:34px;padding:0 14px;border-radius:99px;font-family:var(--fd);font-size:13px;font-weight:500;color:var(--muted)}
.presets button.on{background:var(--soft);color:var(--ink);font-weight:700}

/* ---------- teams ---------- */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:clamp(12px,1.6vw,22px);align-content:start}
.team{--c:#2F6BFF;background:var(--card);border-radius:var(--r);padding:26px 22px 20px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden;
  box-shadow:0 1px 0 var(--line),0 24px 50px -36px rgba(20,20,50,.35);transition:box-shadow .3s}
.team::before{content:'';position:absolute;left:0;right:0;top:0;height:7px;background:var(--c)}
.team.losing{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent),0 24px 50px -30px color-mix(in srgb,var(--c) 60%,transparent)}
.team-head{display:flex;align-items:center;gap:10px;min-height:32px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.tname{font-family:var(--fd);font-weight:700;font-size:clamp(15px,1.5vw,23px);text-transform:uppercase;letter-spacing:.03em;outline:none;border-radius:10px;padding:3px 7px;margin-left:-7px;min-width:40px;word-break:break-word;cursor:text}
.tname:hover{background:var(--soft)}
.tname:focus{background:color-mix(in srgb,var(--c) 12%,#fff)}
.badge{margin-left:auto;flex:none;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:6px 10px;border-radius:99px;background:#FFF1D6;color:#B86E00}
.score{font-family:var(--fd);font-weight:800;color:var(--c);font-size:clamp(56px,7vw,120px);line-height:.95;text-align:center;letter-spacing:-.02em;padding:6px 0}
.score.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(.85);opacity:.4}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.score-btns{display:flex;gap:10px}
.score-btns button{height:56px;border-radius:18px;font-weight:800;font-size:22px;transition:.15s}
.minus{width:60px;background:var(--soft);color:var(--muted)}
.minus:hover{color:var(--ink)}
.plus{flex:1;background:var(--c);color:#fff;font-family:var(--fd);font-size:20px!important;box-shadow:0 14px 30px -18px var(--c)}
.plus:hover{filter:brightness(1.06);transform:translateY(-1px)}
.advs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adv{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:18px;text-align:left;
  background:#fff;box-shadow:inset 0 0 0 2px var(--line);transition:.15s;min-width:0}
.adv-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.adv-txt{font-weight:800;font-size:14px;line-height:1.2}
.adv-meta{font-family:var(--fd);font-size:12px;font-weight:500;color:var(--muted)}
.adv:not(:disabled):hover{box-shadow:inset 0 0 0 2px var(--c);background:color-mix(in srgb,var(--c) 5%,#fff);transform:translateY(-1px)}
.adv:disabled{opacity:.4}
.adv.used{opacity:.32}
.adv.used .adv-txt{text-decoration:line-through}
.adv-note{font-size:12px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.02em}

/* duo: team | timer | team */
@media (min-width:900px){
  main.duo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:clamp(20px,3vw,48px);align-items:stretch}
  main.duo .teams{display:contents}
  main.duo .team:nth-child(1){order:0}
  main.duo .timer-wrap{order:1}
  main.duo .team:nth-child(2){order:2}
  main.duo .team{justify-content:center;padding:clamp(28px,3vw,44px);gap:22px}
  main.duo .team-head{justify-content:center}
  main.duo .tname{font-size:clamp(20px,2.1vw,34px);text-align:center;margin:0}
  main.duo .badge{position:absolute;top:22px;right:22px}
  main.duo .score{font-size:clamp(96px,10.5vw,200px)}
  main.duo .ring{--size:clamp(280px,min(54vh,34vw),600px)}
  main.duo .score-btns button{height:64px}
}
/* multi: timer left, teams grid right */
@media (min-width:1100px){
  main.multi{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:clamp(24px,3vw,48px)}
  main.multi .ring{--size:clamp(260px,min(52vh,30vw),520px)}
  main.multi .teams{grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
}
main.multi .team{padding:22px 18px 16px;gap:12px}
main.multi .score{font-size:clamp(48px,4.6vw,86px)}
main.multi .score-btns button{height:50px}
main.multi .adv{padding:11px}
main.multi .adv-ico{width:28px;height:28px}
main.multi .adv-txt{font-size:13px}

.hint{text-align:center;font-size:12px;font-weight:700;color:#A6A9B2;letter-spacing:.04em;padding:0 var(--pad) 14px}

/* ---------- dialog ---------- */
dialog{border:0;border-radius:28px;padding:0;width:min(620px,94vw);max-height:92vh;margin:auto;background:#fff;color:var(--ink);
  box-shadow:0 40px 120px -30px rgba(20,20,60,.45)}
dialog::backdrop{background:rgba(245,244,240,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
dialog[open]{display:flex;flex-direction:column;animation:dlg .25s}
@keyframes dlg{from{opacity:0;transform:translateY(12px) scale(.98)}}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:24px 28px 6px}
.dlg-head h3{font-family:var(--fd);font-size:20px;font-weight:700}
.dlg-head .ibtn{box-shadow:none;background:var(--soft)}
.dlg-body{padding:6px 28px 20px;overflow:auto}
.dlg-foot{display:flex;gap:10px;justify-content:space-between;padding:16px 28px 22px;border-top:1px solid var(--line)}
.sec{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
.trow{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.cdot{width:44px;height:44px;border-radius:50%;background:var(--c);flex:none;box-shadow:inset 0 0 0 4px #fff,0 0 0 2px var(--c)}
.trow input,.field input{height:48px;border-radius:14px;border:2px solid var(--line);padding:0 14px;font:inherit;font-weight:700;color:var(--ink);background:#fff;width:100%}
.trow input{flex:1;text-transform:uppercase;font-family:var(--fd);font-size:14px;letter-spacing:.03em}
.trow input:focus,.field input:focus{outline:none;border-color:var(--accent)}
.del{width:44px;height:44px;border-radius:12px;color:var(--muted);display:grid;place-items:center;flex:none}
.del:hover:not(:disabled){background:#FDECEA;color:var(--danger)}
.del:disabled{opacity:.3}
.add{width:100%;height:48px;border-radius:14px;border:2px dashed var(--line);font-weight:800;color:var(--muted);margin-top:4px}
.add:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.add:disabled{opacity:.4}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.field input{font-family:var(--fd);font-weight:500}
.field em{font-style:normal;font-size:11px;color:#A6A9B2}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-weight:700;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:99px;background:#E4E2DC;position:relative;cursor:pointer;transition:.2s;flex:none}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:.2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:25px}
.btn{height:50px;padding:0 22px;border-radius:99px;font-weight:800;font-size:15px;transition:.15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.ghost.confirm{background:#FDECEA;color:var(--danger)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:99px;
  padding:10px 10px 10px 22px;display:flex;align-items:center;gap:14px;font-weight:700;font-size:14px;transition:.25s;z-index:50;max-width:92vw;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:rgba(255,255,255,.14);color:#fff;border-radius:99px;height:36px;padding:0 16px;font-weight:800}
.toast:not(:has(button)){padding-right:22px}

/* ---------- mobile ---------- */
@media (max-width:720px){
  .brand small,.hint{display:none}
  .qnav{order:3;width:100%;justify-content:space-between}
  .seg button{padding:0 9px}
  .ibtn{width:42px;height:42px}
  .main-btn{min-width:170px;height:60px;font-size:16px}
  .cbtn{width:52px;height:52px}
  .teams{grid-template-columns:repeat(2,minmax(0,1fr))}
  .team{padding:20px 14px 14px;gap:12px}
  .advs{grid-template-columns:1fr}
  .adv{flex-direction:row;align-items:center;padding:10px}
  .adv-txt{font-size:12px;flex:1}
  .score-btns button{height:48px}
  .fields{grid-template-columns:1fr}
}
@media (max-width:420px){ .teams{grid-template-columns:1fr} }
:fullscreen .hint{display:none}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true"></div>
    <div><h1 id="title">ЗАКОВАТ</h1><small data-t="subtitle"></small></div>
  </div>

  <div class="qnav">
    <button id="qPrev" data-tt="prevQ"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="qlabel"><span data-t="question"></span><b id="qNum">1</b><i id="qTot"></i></div>
    <button id="qNext" data-tt="nextQ"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>

  <div class="actions">
    <div class="seg" id="lang">
      <button data-l="kz">QAZ</button><button data-l="ru">RU</button><button data-l="uz">UZ</button>
    </div>
    <button class="ibtn" id="soundBtn" data-tt="sound"></button>
    <button class="ibtn" id="setBtn" data-tt="settings"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
    <button class="ibtn" id="fsBtn" data-tt="fullscreen"></button>
  </div>
</header>

<main id="stage">
  <section class="timer-wrap">
    <div class="ring" id="ring">
      <svg viewBox="0 0 200 200">
        <g id="ticks"></g>
        <circle class="track" cx="100" cy="100" r="84" fill="none" stroke-width="7"/>
        <circle class="prog" id="prog" cx="100" cy="100" r="84" fill="none" stroke-width="7"/>
      </svg>
      <div class="ring-center">
        <div class="time" id="time"></div>
        <div class="status" id="status"></div>
      </div>
    </div>
    <div class="banner" id="banner"></div>
    <div class="controls">
      <button class="cbtn" id="resetBtn" data-tt="reset"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button class="main-btn" id="mainBtn"></button>
      <button class="cbtn" id="plus10" data-tt="plus10">+10</button>
    </div>
    <div class="presets" id="presets"></div>
  </section>

  <section class="teams" id="teams"></section>
</main>

<footer class="hint" data-t="hint"></footer>

<dialog id="settings">
  <div class="dlg-head">
    <h3 data-t="settings"></h3>
    <button class="ibtn" id="closeSet" aria-label="close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="dlg-body">
    <div class="sec" data-t="teams"></div>
    <div id="teamList"></div>
    <button class="add" id="addTeam">+ <span data-t="addTeam"></span></button>

    <div class="sec" data-t="timeSec"></div>
    <div class="fields">
      <label class="field"><span data-t="timerSec"></span><input type="number" id="fTimer" min="5" max="900" inputmode="numeric"></label>
      <label class="field"><span data-t="bonusSec"></span><input type="number" id="fBonus" min="5" max="600" inputmode="numeric"></label>
      <label class="field"><span data-t="uses"></span><input type="number" id="fUses" min="1" max="9" inputmode="numeric"></label>
      <label class="field"><span data-t="totalQ"></span><input type="number" id="fTotal" min="0" max="200" inputmode="numeric"><em data-t="zeroInf"></em></label>
    </div>

    <div class="sec" data-t="rules"></div>
    <label class="switch"><span data-t="onlyLosing"></span><input type="checkbox" id="fLosing"></label>
    <label class="switch"><span data-t="sound"></span><input type="checkbox" id="fSound"></label>
  </div>
  <div class="dlg-foot">
    <button class="btn ghost" id="newGame" data-t="newGame"></button>
    <button class="btn primary" id="doneSet" data-t="done"></button>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const KEY = 'zakovat-v1';
const COLORS = ['#2F6BFF','#12B76A','#FF5A36','#F5A400','#8B5CF6','#EC4899','#06B6D4','#F97316'];

const I18N = {
  ru:{title:'ЗАКОВАТ',subtitle:'интеллектуальная игра',question:'Вопрос',prevQ:'Предыдущий вопрос',nextQ:'Следующий вопрос',

const DEF = () => ({
  settings:{timerSec:60,bonusSec:60,uses:1,onlyLosing:true,sound:true,lang:'ru',totalQ:12},
  teams:[
    {name:'ОРИОН',color:COLORS[0],score:0,used:{aud:0,time:0}},
    {name:'АЛ БУХОРИЙ',color:COLORS[1],score:0,used:{aud:0,time:0}}
  ],

});

function load(){
  try{
    const r = JSON.parse(localStorage.getItem(KEY));
    if (r && Array.isArray(r.teams) && r.teams.length >= 2 && r.settings){
      const d = DEF();
      r.settings = Object.assign(d.settings, r.settings);
      r.teams.forEach(tm => { tm.used = Object.assign({aud:0,time:0}, tm.used || {}); tm.score = +tm.score || 0; });
      r.q = Math.max(1, +r.q || 1);
      return r;
    }
  }catch(e){}
  return DEF();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

let S = load();
const $ = s => document.querySelector(s);
const t = k => (I18N[S.settings.lang] || I18N.ru)[k] ?? I18N.ru[k] ?? k;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const fmt = sec => { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); };

const stage=$('#stage'), teamsEl=$('#teams'), ring=$('#ring'), prog=$('#prog'), timeEl=$('#time'), statusEl=$('#status'),
      mainBtn=$('#mainBtn'), bannerEl=$('#banner'), dlg=$('#settings'), toastEl=$('#toast');

/* ---------- ring geometry ---------- */
const R = 84, C = 2 * Math.PI * R;
prog.setAttribute('stroke-dasharray', C.toFixed(2));
(() => {
  let h = '';
  for (let i = 0; i < 60; i++){
    const a = i / 60 * Math.PI * 2, big = i % 5 === 0, r1 = big ? 91 : 93.5, r2 = 97;
    h += `<line class="tick${big?' big':''}" x1="${(100+r1*Math.cos(a)).toFixed(2)}" y1="${(100+r1*Math.sin(a)).toFixed(2)}" x2="${(100+r2*Math.cos(a)).toFixed(2)}" y2="${(100+r2*Math.sin(a)).toFixed(2)}"/>`;
  }
  $('#ticks').innerHTML = h;
})();

/* ---------- audio ---------- */
let AC = null;
function ensureAudio(){
  if (!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, o = {}){
  if (!S.settings.sound || !AC) return;
  const t0 = AC.currentTime + (o.delay || 0), vol = o.vol ?? .22;
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = o.type || 'sine'; osc.frequency.value = f;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  osc.connect(g).connect(AC.destination);
  osc.start(t0); osc.stop(t0 + d + .05);
}
const sfx = {
  start(){ tone(660,.16); tone(990,.26,{delay:.11}); },
  warn(){ tone(880,.32,{type:'triangle'}); tone(880,.32,{type:'triangle',delay:.42}); },
  tick(){ tone(1250,.07,{type:'square',vol:.06}); },
  end(){ tone(392,2.2,{vol:.26}); [523,659,784].forEach((f,i)=>tone(f,1.8,{type:'triangle',vol:.16,delay:i*.03})); },
  bonus(){ tone(523,.14); tone(659,.14,{delay:.1}); tone(784,.3,{delay:.2}); }
};

/* ---------- timer ---------- */
const T = { total:60000, remaining:60000, running:false, endAt:0, phase:'ready', raf:0, lastSec:60 };

function resetTimer(){
  cancelAnimationFrame(T.raf);
  T.total = T.remaining = S.settings.timerSec * 1000;
  T.running = false; T.phase = 'ready'; T.lastSec = S.settings.timerSec;
  hideBanner(); drawTimer();
}
function start(){
  if (T.remaining <= 0) return;
  ensureAudio();
  T.running = true; T.phase = 'running';
  T.endAt = performance.now() + T.remaining;
  T.lastSec = Math.ceil(T.remaining / 1000);
  sfx.start(); drawTimer(); loop();
}
function pause(){
  if (!T.running) return;
  T.remaining = Math.max(0, T.endAt - performance.now());
  T.running = false; T.phase = 'paused';
  cancelAnimationFrame(T.raf); drawTimer();
}
function toggle(){
  if (T.running) pause();
  else if (T.phase === 'done'){ resetTimer(); start(); }
  else start();
}
function loop(){
  if (!T.running) return;
  T.remaining = Math.max(0, T.endAt - performance.now());
  const sec = Math.ceil(T.remaining / 1000);
  if (sec !== T.lastSec){
    if (sec === 10) sfx.warn(); else if (sec >= 1 && sec <= 5) sfx.tick();
    T.lastSec = sec;
  }
  if (T.remaining <= 0){ finish(); return; }
  drawTimer();
  T.raf = requestAnimationFrame(loop);
}
function finish(){
  T.running = false; T.remaining = 0; T.phase = 'done';
  sfx.end(); drawTimer();
}
function addTime(ms){
  if (T.running){ T.endAt += ms; T.remaining = T.endAt - performance.now(); }
  else T.remaining += ms;
  T.total = Math.max(T.total, T.remaining);
  T.lastSec = Math.ceil(T.remaining / 1000);
}

function drawTimer(){
  const sec = Math.ceil(T.remaining / 1000);
  timeEl.innerHTML = fmt(sec).split('').map(ch => ch === ':' ? '<span class="c">:</span>' : `<span class="d">${ch}</span>`).join('');
  const p = T.total > 0 ? clamp(T.remaining / T.total, 0, 1) : 0;
  prog.style.strokeDashoffset = (C * (1 - p)).toFixed(2);
  const live = T.phase === 'running' || T.phase === 'paused';
  ring.classList.toggle('warn', live && sec <= 10 && sec > 5);
  ring.classList.toggle('danger', live && sec <= 5);
  ring.classList.toggle('done', T.phase === 'done');
  statusEl.textContent = t(T.phase);
  const map = { ready:['play','start'], running:['pause','pause'], paused:['play','resume'], done:['again','again'] }[T.phase];
  const html = ICON[map[0]] + `<span>${esc(t(map[1]))}</span>`;
  if (mainBtn.dataset.state !== T.phase + S.settings.lang){ mainBtn.innerHTML = html; mainBtn.dataset.state = T.phase + S.settings.lang; }
  mainBtn.classList.toggle('running', T.running);
}

/* ---------- banner / toast ---------- */
function showBanner(tm, k){
  bannerEl.innerHTML = `<span style="--c:${tm.color}">${esc(tm.name)} · ${esc(t(k))} · +${fmt(S.settings.bonusSec)}</span>`;
}
function hideBanner(){ bannerEl.innerHTML = ''; }
let toastTimer;
function toast(msg, undo){
  toastEl.innerHTML = `<span>${esc(msg)}</span>` + (undo ? `<button>${esc(t('undo'))}</button>` : '');
  if (undo) toastEl.querySelector('button').onclick = () => { undo(); hideToast(); };
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, undo ? 6000 : 2600);
}
function hideToast(){ toastEl.classList.remove('show'); }

/* ---------- teams ---------- */
function losingSet(){
  const sc = S.teams.map(x => x.score), mn = Math.min(...sc), mx = Math.max(...sc);
  return S.teams.map(x => mn < mx && x.score === mn);
}
function canUse(i, k){
  const tm = S.teams[i];
  if (tm.used[k] >= S.settings.uses) return false;
  if (S.settings.onlyLosing && !losingSet()[i]) return false;
  return true;
}

function renderTeams(){
  const lose = losingSet(), bonus = fmt(S.settings.bonusSec);
  teamsEl.innerHTML = S.teams.map((tm, i) => {
    const adv = k => {
      const left = S.settings.uses - tm.used[k], used = left <= 0, ok = canUse(i, k);
      const meta = used ? t('used') : '+' + bonus + (S.settings.uses > 1 ? ` · ×${left}` : '');
      return `<button class="adv${used ? ' used' : ''}" data-act="adv" data-k="${k}" data-i="${i}" ${ok ? '' : 'disabled'}>
        <span class="adv-ico">${ICON[k]}</span><span class="adv-txt">${esc(t(k))}</span><span class="adv-meta">${esc(meta)}</span></button>`;
    };
    const note = S.settings.onlyLosing && !lose[i];
    return `<article class="team${lose[i] ? ' losing' : ''}" style="--c:${tm.color}">
      <div class="team-head"><span class="dot"></span><h2 class="tname" contenteditable="true" spellcheck="false" data-i="${i}">${esc(tm.name)}</h2>${lose[i] ? `<span class="badge">${esc(t('behind'))}</span>` : ''}</div>
      <div class="score">${tm.score}</div>
      <div class="score-btns"><button class="minus" data-act="minus" data-i="${i}" aria-label="−1">−</button><button class="plus" data-act="plus" data-i="${i}">+1</button></div>
      <div class="advs">${adv('aud')}${adv('time')}</div>
      <p class="adv-note" style="visibility:${note ? 'visible' : 'hidden'}">${esc(t('onlyBehind'))}</p>
    </article>`;
  }).join('');
  const duo = S.teams.length === 2;
  stage.classList.toggle('duo', duo);
  stage.classList.toggle('multi', !duo);
  const n = S.teams.length;
  stage.style.setProperty('--cols', n <= 4 ? 2 : n <= 6 ? 3 : 4);
}

function changeScore(i, d){
  const tm = S.teams[i]; if (!tm) return;
  const nv = Math.max(0, tm.score + d);
  if (nv === tm.score) return;
  tm.score = nv; save(); renderTeams();
  const el = teamsEl.children[i]?.querySelector('.score');
  if (el){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}

function useAdv(i, k){
  if (!canUse(i, k)) return;
  ensureAudio();
  const tm = S.teams[i], b = S.settings.bonusSec * 1000;
  const wasDone = T.phase === 'done', prevTotal = T.total;
  tm.used[k]++;
  if (wasDone){ T.total = T.remaining = b; start(); }
  else addTime(b);
  showBanner(tm, k); sfx.bonus(); save(); renderTeams(); drawTimer();
  toast(`${tm.name} · ${t(k)} +${fmt(S.settings.bonusSec)}`, () => {
    tm.used[k] = Math.max(0, tm.used[k] - 1);
    if (wasDone){
      cancelAnimationFrame(T.raf); T.running = false; T.phase = 'done'; T.remaining = 0; T.total = prevTotal;
    } else {
      if (T.running) T.endAt -= b; else T.remaining = Math.max(0, T.remaining - b);
      T.total = Math.max(1000, T.total - b);
      if (!T.running && T.remaining <= 0){ T.phase = 'done'; }
    }
    hideBanner(); save(); renderTeams(); drawTimer();
  });
}

teamsEl.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const i = +b.dataset.i, a = b.dataset.act;
  if (a === 'plus') changeScore(i, 1);
  else if (a === 'minus') changeScore(i, -1);
  else if (a === 'adv') useAdv(i, b.dataset.k);
});
teamsEl.addEventListener('keydown', e => {
  if (e.target.classList.contains('tname') && e.key === 'Enter'){ e.preventDefault(); e.target.blur(); }
});
teamsEl.addEventListener('focusout', e => {
  if (!e.target.classList.contains('tname')) return;
  const i = +e.target.dataset.i, v = e.target.textContent.replace(/\s+/g, ' ').trim().slice(0, 40);
  if (v){ S.teams[i].name = v; save(); }
  e.target.textContent = S.teams[i].name;
});
teamsEl.addEventListener('paste', e => {
  if (!e.target.classList || !e.target.classList.contains('tname')) return;
  e.preventDefault();
  const txt = (e.clipboardData || window.clipboardData).getData('text').replace(/\s+/g, ' ');
  document.execCommand('insertText', false, txt);
});

const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function toggleFS(){
  const el = document.documentElement;
  if (!fsEl()){
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { const p = req.call(el); if (p && p.catch) p.catch(() => toast(t('noFs'))); }
    else toast(t('noFs'));
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
}

function renderSettings(){
  $('#teamList').innerHTML = S.teams.map((tm, i) => `
    <div class="trow">
      <button class="cdot" style="--c:${tm.color}" data-sact="color" data-i="${i}" title="${esc(t('color'))}"></button>
      <input value="${esc(tm.name)}" data-sact="name" data-i="${i}" maxlength="40">

  $('#addTeam').disabled = S.teams.length >= 8;
  $('#fTimer').value = S.settings.timerSec;
  $('#fBonus').value = S.settings.bonusSec;
  $('#fUses').value = S.settings.uses;
  $('#fTotal').value = S.settings.totalQ;
  $('#fLosing').checked = S.settings.onlyLosing;
  $('#fSound').checked = S.settings.sound;
}
$('#teamList').addEventListener('input', e => {
  if (e.target.dataset.sact !== 'name') return;
  const v = e.target.value.replace(/\s+/g, ' ').trimStart();
  S.teams[+e.target.dataset.i].name = v || S.teams[+e.target.dataset.i].name;
});
$('#teamList').addEventListener('click', e => {
  const b = e.target.closest('button[data-sact]'); if (!b) return;
  const i = +b.dataset.i;
  if (b.dataset.sact === 'color'){
    const tm = S.teams[i];
    tm.color = COLORS[(COLORS.indexOf(tm.color) + 1) % COLORS.length];
    b.style.setProperty('--c', tm.color);
  } else if (b.dataset.sact === 'del' && S.teams.length > 2){
    S.teams.splice(i, 1); renderSettings();
  }
});
$('#addTeam').onclick = () => {
  if (S.teams.length >= 8) return;
  const usedC = S.teams.map(x => x.color);
  const color = COLORS.find(c => !usedC.includes(c)) || COLORS[S.teams.length % COLORS.length];
  S.teams.push({ name: (t('team') + ' ' + (S.teams.length + 1)).toUpperCase(), color, score:0, used:{aud:0,time:0} });
  renderSettings();
  const inputs = $('#teamList').querySelectorAll('input'); inputs[inputs.length - 1].select();
};
const num = (id, a, b, def) => { const v = parseInt($(id).value, 10); return isNaN(v) ? def : clamp(v, a, b); };
['#fTimer','#fBonus','#fUses','#fTotal'].forEach(id => $(id).addEventListener('change', () => {
  S.settings.timerSec = num('#fTimer', 5, 900, 60);
  S.settings.bonusSec = num('#fBonus', 5, 600, 60);
  S.settings.uses = num('#fUses', 1, 9, 1);
  S.settings.totalQ = num('#fTotal', 0, 200, 12);
  renderSettings();
}));
$('#fLosing').onchange = e => { S.settings.onlyLosing = e.target.checked; };
$('#fSound').onchange = e => { S.settings.sound = e.target.checked; updSound(); };

function openSettings(){ renderSettings(); dlg.showModal(); }
function closeSettings(){ dlg.close(); }
dlg.addEventListener('close', () => {
  S.teams.forEach(tm => { tm.name = (tm.name || '').trim() || t('team').toUpperCase(); });
  if (S.settings.totalQ > 0 && S.q > S.settings.totalQ) S.q = S.settings.totalQ;
  save(); renderTeams(); renderPresets(); renderQ();
  if (!T.running && T.phase === 'ready') resetTimer();
  resetNewGameBtn();
});
dlg.addEventListener('click', e => { if (e.target === dlg) closeSettings(); });
$('#setBtn').onclick = openSettings;
$('#closeSet').onclick = closeSettings;
$('#doneSet').onclick = closeSettings;

let ngTimer;
function resetNewGameBtn(){ const b = $('#newGame'); b.classList.remove('confirm'); b.textContent = t('newGame'); clearTimeout(ngTimer); }
$('#newGame').onclick = () => {
  const b = $('#newGame');
  if (!b.classList.contains('confirm')){
    b.classList.add('confirm'); b.textContent = t('sure');
    ngTimer = setTimeout(resetNewGameBtn, 3500);
    return;
  }
  S.teams.forEach(tm => { tm.score = 0; tm.used = {aud:0,time:0}; });
  S.q = 1; save(); closeSettings(); resetTimer(); renderTeams(); renderQ();
  toast(t('gameReset'));
};

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (dlg.open) return;
  const el = e.target;
  if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const c = e.code;
  if (c === 'Space'){ e.preventDefault(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); toggle(); }
  else if (c === 'KeyR') resetTimer();
  else if (c === 'KeyF') toggleFS();
  else if (c === 'ArrowRight') goQ(1);
  else if (c === 'ArrowLeft') goQ(-1);
  else if (/^Digit[1-8]$/.test(c)){ const i = +c.slice(5) - 1; if (S.teams[i]) changeScore(i, e.shiftKey ? -1 : 1); }
});
// Space on a focused button should not double-trigger
document.addEventListener('keyup', e => { if (e.code === 'Space' && e.target.tagName === 'BUTTON') e.preventDefault(); });

/* ---------- init ---------- */
updFs(); updSound(); renderPresets(); resetTimer(); applyLang();
})();
</script>
</body>
</html>
